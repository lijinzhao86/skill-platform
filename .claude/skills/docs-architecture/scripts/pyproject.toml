# The docs-architecture skill's Python tooling: the validator in this directory,
# plus its tests. Never built or installed — only run in place, which is why it
# declares no build system.
[project]
name = "skill-platform-docs-check"
version = "0.0.0"
description = "Documentation validator and its tests, for the docs-architecture skill"
requires-python = ">=3.11"

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
# Pinned deliberately, and mirrored in skill-platform-server: ruff 0.16 changed its
# default rule set, so leaving `select` unset would silently change what this
# project checks (the validator gains EXE001/FURB167-style findings it does not
# have under this policy).
select = ["E4", "E7", "E9", "F", "UP", "I", "B"]
