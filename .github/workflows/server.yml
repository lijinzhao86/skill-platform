# Everything about the server lives under skill-platform-server/, so only changes
# there (plus the gateway content its image carries) trigger this.
name: Server

on:
  push:
    branches: [ main ]
    paths: &paths
      - 'skill-platform-server/**'
      - 'gateway/**'
      # .dockerignore decides what the image build below can see, so a change to it
      # has to run this workflow.
      - '.dockerignore'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [ main ]
    paths: *paths

permissions:
  contents: read

env:
  AWS_REGION: us-west-1
  ECR_REPOSITORY: skill-platform

jobs:
  test:
    name: Test and lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skill-platform-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  build:
    name: Build and push
    # Only a push to main publishes an image. A pull request runs the tests
    # alone: an in-repo PR would otherwise push an image for an unmerged
    # commit, and a forked PR has no credentials to push with in any case.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The build context is the repository root because the image also carries
      # gateway/ — the content the API serves. .dockerignore trims the rest.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: skill-platform-server/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=main-skill-platform
          cache-to: type=gha,scope=main-skill-platform,mode=max
