# Everything about the server lives under skillmaster-server/, so only changes
# there (plus the gateway content its image carries) trigger this.
#
# Disabled on GitHub while the Java server is being built out — re-enable it once the
# server runs locally. A disabled workflow leaves no trace in this file.
name: Server

on:
  push:
    branches: [ main ]
    paths: &paths
      - 'skillmaster-server/**'
      # The archived Python baseline is a design reference, not built code — editing it
      # must not trigger a Java build. (`reference-python/README.md` promises this.)
      - '!skillmaster-server/reference-python/**'
      - 'gateway/**'
      # .dockerignore decides what the image build below can see, so a change to it
      # has to run this workflow.
      - '.dockerignore'
      - '.github/workflows/server.yml'
  pull_request:
    branches: [ main ]
    paths: *paths

permissions:
  contents: read

env:
  AWS_REGION: us-west-1
  ECR_REPOSITORY: skillmaster

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skillmaster-server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # ./mvnw downloads its own Maven, so the runner needs a JDK and nothing else.
      - name: Test
        run: ./mvnw -B verify

  build:
    name: Build and push
    # Only a push to main publishes an image. A pull request runs the tests
    # alone: an in-repo PR would otherwise push an image for an unmerged
    # commit, and a forked PR has no credentials to push with in any case.
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # TODO: this publishes to Amazon ECR, but the service is deployed on Aliyun —
      # the registry has to become ACR. Left alone because the workflow is disabled.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The build context is the repository root because the image also carries
      # gateway/ — the content the API serves. .dockerignore trims the rest.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: skillmaster-server/Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=main-skillmaster
          cache-to: type=gha,scope=main-skillmaster,mode=max
