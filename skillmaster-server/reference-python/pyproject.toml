[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-platform-server"
version = "0.1.0"
description = "skill-platform server: skill hosting, server-side search, and remote progressive loading"
# The floor the code needs. `.python-version` separately pins 3.13, so that local
# and CI runs use the same interpreter as the image (python:3.13-slim).
requires-python = ">=3.11"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]

# Dev tooling is declared here, not at the repository root: this directory is a
# self-contained project, and the repository's other subprojects may not be
# Python at all. Run everything from this directory.
[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src"]
extend-exclude = ["*.egg-info"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "I", "B"]
